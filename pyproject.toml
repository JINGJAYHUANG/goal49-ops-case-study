[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goal49-ops-case-study"
version = "0.1.0"
description = "A synthetic reliability-engineering case study for scheduled decision pipelines."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "JINGJAYHUANG"}]
keywords = ["reliability", "automation", "idempotency", "incident-response", "github-actions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
goal49-ops-demo = "goal49_ops_case_study.cli:main"

[project.urls]
Repository = "https://github.com/JINGJAYHUANG/goal49-ops-case-study"
Issues = "https://github.com/JINGJAYHUANG/goal49-ops-case-study/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
