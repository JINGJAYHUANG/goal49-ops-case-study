name: Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version tag, for example v0.2.0
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: write

concurrency:
  group: goal49-ops-case-study-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            version="v0.1.0"
          else
            version="${{ inputs.version }}"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || exit 64
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "plain=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Re-run release gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps -e .
          python -m compileall -q src scripts tests
          python -m unittest discover -s tests -v
          python scripts/public_audit.py .
          rm -rf /tmp/goal49-release-a /tmp/goal49-release-b
          goal49-ops-demo run-demo --config examples/synthetic-config.json --universe examples/synthetic-universe.json --workdir /tmp/goal49-release-a > /tmp/result-a.json
          goal49-ops-demo run-demo --config examples/synthetic-config.json --universe examples/synthetic-universe.json --workdir /tmp/goal49-release-b > /tmp/result-b.json
          diff -u /tmp/result-a.json /tmp/result-b.json
          diff -ru /tmp/goal49-release-a /tmp/goal49-release-b
          goal49-ops-demo verify --workdir /tmp/goal49-release-a --target DEMO-2026-01-15

      - name: Create or verify tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            [[ "$(git rev-list -n 1 "$VERSION")" == "$GITHUB_SHA" ]] || exit 65
          else
            git tag -a "$VERSION" -m "Goal49 Operations Case Study $VERSION"
            git push origin "$VERSION"
          fi

      - name: Build artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLAIN_VERSION: ${{ steps.version.outputs.plain }}
        run: |
          set -euo pipefail
          mkdir -p dist
          prefix="goal49-ops-case-study-${PLAIN_VERSION}/"
          git archive --format=tar --prefix="$prefix" "$VERSION" | gzip -n > "dist/goal49-ops-case-study-${PLAIN_VERSION}.tar.gz"
          git archive --format=zip --prefix="$prefix" "$VERSION" > "dist/goal49-ops-case-study-${PLAIN_VERSION}.zip"
          python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir dist .
          printf '{\n  "commit": "%s",\n  "deterministic_demo": "passed",\n  "public_boundary_audit": "passed",\n  "repository": "%s",\n  "schema": 1,\n  "tests": 17,\n  "version": "%s",\n  "workflow_run_id": "%s"\n}\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$VERSION" "$GITHUB_RUN_ID" \
            > dist/RELEASE_PROVENANCE.json
          (cd dist && sha256sum \
            goal49-ops-case-study-${PLAIN_VERSION}.tar.gz \
            goal49-ops-case-study-${PLAIN_VERSION}.zip \
            goal49_ops_case_study-${PLAIN_VERSION}-py3-none-any.whl \
            RELEASE_PROVENANCE.json > SHA256SUMS.txt)

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PLAIN_VERSION: ${{ steps.version.outputs.plain }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## Goal49 Operations Case Study v0.1.0

          A sanitized, executable reliability-engineering case study for scheduled decision pipelines.

          Included: canonical snapshot integrity, data freshness and coverage gates, deterministic fallback, stable delivery identity, duplicate/conflict protection, deadline-aware failure, stage-specific health checks, synthetic fixtures, 17 regression tests and Python 3.11–3.13 CI.

          This release contains no private selection logic, real instruments, prices, recommendations, performance, credentials, production state or message destinations. It is an operations case study, not an investment system or an exactly-once distributed-delivery guarantee.
          EOF
          assets=(
            "dist/goal49-ops-case-study-${PLAIN_VERSION}.tar.gz"
            "dist/goal49-ops-case-study-${PLAIN_VERSION}.zip"
            "dist/goal49_ops_case_study-${PLAIN_VERSION}-py3-none-any.whl"
            "dist/SHA256SUMS.txt"
            "dist/RELEASE_PROVENANCE.json"
          )
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "${assets[@]}" --clobber
            gh release edit "$VERSION" --title "Goal49 Operations Case Study $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$VERSION" "${assets[@]}" --title "Goal49 Operations Case Study $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
          fi
